name: QA Docker 

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Building docker image 
      run: docker build -t qa-learning .

    - name: Run docker 
      run: docker run --rm qa-learning 



    

