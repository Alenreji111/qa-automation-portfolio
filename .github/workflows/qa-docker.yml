name: QA Docker Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building docker image 
        run: docker build -t qa-learning .
  
      - name: Run docker 
        run: docker run --rm qa-learning 

      - name: Create results directory
        run: mkdir -p docker-results

      - name: Run QA tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/docker-results:/app/test-results" \
            qa-learning
      


    

