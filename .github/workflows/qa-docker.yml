name: QA Docker Tests

on:
  push:
  pull_request:

jobs:

  smoke-test: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Build docker image 
        run: docker build -t qa-learning .

      - name: Run docker image 
        run: docker run --rm qa-learning pytest -m smoke -v

  regression-test:
    runs-on: ubuntu-latest 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker image 
        run: docker build -t qa-learning .

      - name: Run docker image 
        run: docker run --rm qa-learning pytest -m regression -v
        
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building docker image 
        run: docker build -t qa-learning .

      - name: Run docker 
        run: docker run --rm qa-learning 

      - name: Create results directory
        run: mkdir -p docker-results

      - name: Run QA tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/docker-results:/app/test-results" \
            qa-learning

      - name: Upload test artifacts 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: docker-results/
      


    

